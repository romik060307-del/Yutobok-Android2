name: Build Yutobok APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Manual Gradle Setup and Build
        run: |
          # 1. Download & Extract Gradle 7.5
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip
          unzip -q gradle-7.5-bin.zip
          export PATH=$PWD/gradle-7.5/bin:$PATH

          # 2. Generate Wrapper secara otomatis
          gradle wrapper --gradle-version 7.5
          chmod +x gradlew

          # 3. Jalankan Build APK Debug
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yutobok-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
